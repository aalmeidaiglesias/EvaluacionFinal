<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar producto | Inventario</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #e9eef5);
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(90deg, #0d6efd, #6610f2);
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .delete-container {
            max-width: 550px;
            margin: 80px auto;
        }

        .delete-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
            overflow: hidden;
        }

        .delete-icon {
            width: 90px;
            height: 90px;
            background: #ffe5e5;
            color: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 25px;
        }

        .product-name {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            font-weight: bold;
            color: #343a40;
        }

        .btn {
            border-radius: 10px;
            padding: 10px 20px;
        }
    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-dark navbar-custom shadow-sm">

        <div class="container">

            <a class="navbar-brand" href="{% url 'lista_productos' %}">

                <i class="bi bi-box-seam me-2"></i>

                Inventario CRUD

            </a>

        </div>

    </nav>


    <!-- CONFIRMACION -->

    <div class="container">

        <div class="delete-container">

            <div class="card delete-card">

                <div class="card-body text-center p-5">


                    <div class="delete-icon">

                        <i class="bi bi-trash3"></i>

                    </div>


                    <h2 class="fw-bold mb-3">

                        ¿Eliminar producto?

                    </h2>


                    <p class="text-muted">

                        Estás a punto de eliminar el siguiente producto:

                    </p>


                    <div class="product-name mb-4">

                        <i class="bi bi-box me-2"></i>

                        {{ producto.nombre }}

                    </div>


                    <p class="text-muted small">

                        Esta acción no se puede deshacer.

                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="d-flex justify-content-center
                                gap-2 mt-4">

                            <a href="{% url 'lista_productos' %}" class="btn btn-outline-secondary">

                                <i class="bi bi-arrow-left me-2"></i>

                                Cancelar

                            </a>


                            <button type="submit" class="btn btn-danger">

                                <i class="bi bi-trash3 me-2"></i>

                                Sí, eliminar

                            </button>

                        </div>

                    </form>


                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
